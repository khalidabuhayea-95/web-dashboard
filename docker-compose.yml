# Local validation stack for the containerized web + import worker.
# Throwaway Postgres (data in a named volume). No real secrets — this is NOT a
# production compose file; it exists to prove the image builds and the services
# boot, migrate, and drain jobs inside containers.
#
#   docker compose build
#   docker compose run --rm web npx prisma migrate deploy
#   docker compose up -d
#   # then INSERT a pending import_jobs row and watch the worker claim it

x-app-env: &app-env
  NODE_ENV: production
  PORT: "3000"
  DATABASE_URL: postgresql://nayroz_user:localdev@postgres:5432/nayroz_app
  # Dummy auth secret — local only, not exercised by the worker path.
  AUTH_SECRET: local-dev-secret-not-for-prod
  NEXT_PUBLIC_APP_URL: http://localhost:8080
  # R2: explicit LOCAL-TEST bucket names so a stray upload can never hit the
  # real `nayroz-media-dev` / `nayroz-processing-dev` code defaults. Creds are
  # intentionally unset → any actual upload throws (we don't exercise uploads).
  R2_PUBLIC_BUCKET: local-test-public
  R2_PRIVATE_BUCKET: local-test-private
  EDITOR_MEDIA_BUCKET: local-test-public
  TEMPLATE_THUMBNAIL_BUCKET: local-test-public

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: nayroz_user
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: nayroz_app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nayroz_user -d nayroz_app"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      # Host 5434 to avoid clashing with the local dev DB on 5433.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    image: web-dashboard:local
    command: ["npm", "run", "start"]
    environment: *app-env
    ports:
      # Direct host access to the Next server (in addition to Caddy on :8080).
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Node 22 has global fetch — no curl/wget dependency needed.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  worker:
    # Reuses the image built by the `web` service (same Dockerfile). Only `web`
    # declares `build:` so `docker compose build` builds the image once —
    # building both in parallel exhausts the BuildKit VM during the heavy
    # Chromium/apt step.
    image: web-dashboard:local
    command: ["npm", "run", "worker"]
    environment:
      <<: *app-env
      IMPORT_JOBS_WORKER_ID: worker-1
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
