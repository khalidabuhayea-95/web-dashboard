name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder

      # Type check is currently non-blocking: there is a known backlog of
      # pre-existing errors (next.config sets typescript.ignoreBuildErrors).
      # Remove `continue-on-error` once the backlog is burned down so new type
      # errors start failing the build.
      - name: Type check (non-blocking)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: build-time-placeholder
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder

      - name: Security audit (high severity, prod deps)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
