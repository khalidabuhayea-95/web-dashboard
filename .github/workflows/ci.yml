name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    # Throwaway database for the tests that need real Postgres (credit reservations, search,
    # taxonomy counts). They read NAYROZ_TEST_DATABASE_URL and skip themselves without it.
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: nayroz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d nayroz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NAYROZ_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/nayroz_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder

      - name: Type check
        run: npx tsc --noEmit

      # ESLint, including the website / dashboard / api import boundaries, and the gate that
      # every mobile API route is documented in the OpenAPI spec.
      - name: Lint
        run: npm run lint

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.NAYROZ_TEST_DATABASE_URL }}

      - name: Unit tests
        run: npm run test:unit

      - name: Canva importer extension tests
        run: npm run test:extension

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: build-time-placeholder
          DATABASE_URL: postgresql://placeholder:placeholder@127.0.0.1:5432/placeholder

      # Advisory only: a new upstream advisory should not block a merge on its own.
      - name: Security audit (high severity, prod deps)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
